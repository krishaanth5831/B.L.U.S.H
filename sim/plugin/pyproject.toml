# lerobot finds this package by its name prefix (lerobot_robot_*) and imports it, which registers
# --robot.type=so101_mujoco for every lerobot command. Install once into the lerobot env:
#   pip install -e sim/plugin
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_so101_mujoco"
version = "0.1.0"
description = "B.L.U.S.H MuJoCo sim follower for lerobot (leader arm -> sim greenhouse)"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.3"]

[tool.setuptools]
packages = ["lerobot_robot_so101_mujoco"]
